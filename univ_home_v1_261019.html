<!DOCTYPE html>
<html lang="ko">
<head>

  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="univ_favicon.svg?v=1">
  <title>CLIPO University · 교수</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-gov.min.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  
  <style>
    *{ font-family:'Pretendard GOV',-apple-system,sans-serif; box-sizing:border-box; word-break:keep-all; }
    body{ margin:0; background:#f6f7f9; color:#222631; font-size:16px; min-width:1280px; }
    a{ text-decoration:none; color:inherit; }
    button{ font-family:inherit; }
    button, .btn{ display:inline-flex; align-items:center; justify-content:center; line-height:1; vertical-align:middle; }

    
    .sb{ position:fixed; top:0; bottom:0; left:0; width:248px; background:#fff; border-right:1px solid #dde1e8; display:flex; flex-direction:column; z-index:150; transition:width .2s ease; }
    body.sb-collapsed .sb{ width:68px; }
    .sb-top{ height:64px; display:flex; align-items:center; gap:8px; padding:0 12px 0 20px; flex-shrink:0; }
    .sb-logo{ display:inline-flex; align-items:center; gap:8px; cursor:pointer; min-width:0; }
    .sb-logo-tag{ height:20px; padding:0 6px; border-radius:4px; background:#e9f2ff; color:#3151c4; font-size:12px; font-weight:600; display:inline-flex; align-items:center; line-height:1; letter-spacing:.02em; white-space:nowrap; }
    .sb-fold{ margin-left:auto; width:36px; height:36px; border:none; background:none; border-radius:6px; color:#6d7381; cursor:pointer; flex-shrink:0; }
    .sb-fold:hover{ background:#f1f3f5; }
    body.sb-collapsed .sb-top{ padding:0 16px; justify-content:center; }
    body.sb-collapsed .sb-logo{ display:none; }
    body.sb-collapsed .sb-fold{ margin:0; }

    .sb-org{ margin:4px 12px 12px; padding:10px 12px; border-radius:8px; background:#f6f7f9; display:flex; align-items:center; gap:10px; min-width:0; }
    .sb-org-ico{ width:28px; height:28px; border-radius:6px; background:#fff; border:1px solid #e4e7ec; color:#3b3f4c; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; }
    .sb-org-name{ font-size:14px; font-weight:600; color:#222631; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    body.sb-collapsed .sb-org{ padding:10px 0; justify-content:center; background:none; }
    body.sb-collapsed .sb-org-name{ display:none; }

    .sb-scroll{ flex:1; overflow-y:auto; overflow-x:hidden; padding:0 0 8px; }
    .si{ height:42px; display:flex; align-items:center; gap:12px; margin:0 12px 2px; padding:0 12px; border-radius:8px; color:#3b3f4c; cursor:pointer; position:relative; white-space:nowrap; font-size:15px; font-weight:500; }
    .si:hover{ background:#f1f3f5; }
    .si.active{ background:#e9f2ff; color:#416bff; }
    .si svg{ width:20px; height:20px; flex-shrink:0; }
    .si-label{ overflow:hidden; text-overflow:ellipsis; }
    .si-tip{ position:absolute; left:52px; top:50%; transform:translateY(-50%); background:#222631; color:#fff; font-size:12px; padding:4px 8px; border-radius:4px; white-space:nowrap; display:none; z-index:300; pointer-events:none; }
    body.sb-collapsed .si{ justify-content:center; padding:0; }
    body.sb-collapsed .si-label{ display:none; }
    body.sb-collapsed .si:hover .si-tip{ display:block; }

    .sb-sec{ display:flex; align-items:center; justify-content:space-between; margin:18px 24px 6px; font-size:13px; font-weight:600; color:#6d7381; white-space:nowrap; }
    body.sb-collapsed .sb-sec{ margin:14px 0 6px; justify-content:center; }
    body.sb-collapsed .sb-sec span{ display:none; }
    body.sb-collapsed .sb-sec:before{ content:""; width:28px; height:1px; background:#e4e7ec; }
    .sc{ height:40px; display:flex; align-items:center; gap:10px; margin:0 12px 2px; padding:0 12px; border-radius:8px; cursor:pointer; position:relative; white-space:nowrap; font-size:14px; color:#3b3f4c; }
    .sc:hover{ background:#f1f3f5; }
    .sc.on{ background:#e9f2ff; color:#416bff; }
    .sc-ini{ width:24px; height:24px; border-radius:6px; background:#e9f2ff; color:#3151c4; font-size:12px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
    .sc-name{ overflow:hidden; text-overflow:ellipsis; }
    body.sb-collapsed .sc{ justify-content:center; padding:0; }
    body.sb-collapsed .sc-name{ display:none; }
    body.sb-collapsed .sc:hover .si-tip{ display:block; }

    .sb-bottom{ border-top:1px solid #eef0f3; padding:12px 0 14px; flex-shrink:0; }
    
    .cr{ margin:0 12px 10px; padding:12px 14px; border-radius:8px; background:#f6f7f9; }
    .cr-row{ display:flex; align-items:center; gap:8px; font-size:14px; color:#3b3f4c; white-space:nowrap; }
    .cr-row svg{ width:18px; height:18px; color:#416bff; flex-shrink:0; }
    .cr-num{ margin-left:auto; font-size:15px; font-weight:600; color:#222631; }
    .cr-num small{ font-size:13px; font-weight:400; color:#6d7381; }
    .cr-bar{ height:4px; border-radius:2px; background:#e4e7ec; margin:10px 0 8px; overflow:hidden; }
    .cr-bar i{ display:block; height:100%; background:#416bff; border-radius:2px; }
    .cr-note{ font-size:13px; color:#6d7381; margin:0; white-space:nowrap; }
    body.sb-collapsed .cr{ padding:10px 0; background:none; display:flex; justify-content:center; position:relative; cursor:default; }
    body.sb-collapsed .cr-row span, body.sb-collapsed .cr-bar, body.sb-collapsed .cr-note{ display:none; }
    body.sb-collapsed .cr-num{ display:none; }
    body.sb-collapsed .cr:hover .si-tip{ display:block; }
    .cr .si-tip{ display:none; }

    .me{ display:flex; align-items:center; gap:10px; margin:6px 12px 0; padding:8px 10px; border-radius:8px; cursor:pointer; position:relative; }
    .me:hover{ background:#f1f3f5; }
    .me-av{ width:32px; height:32px; border-radius:50%; background:#e9f2ff; color:#3151c4; font-size:14px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
    .me-txt{ min-width:0; flex:1; }
    .me-name{ font-size:14px; font-weight:600; color:#222631; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .me-sub{ font-size:13px; color:#6d7381; white-space:nowrap; }
    .me-chev{ color:#6d7381; width:16px; height:16px; flex-shrink:0; }
    body.sb-collapsed .me{ justify-content:center; padding:8px 0; }
    body.sb-collapsed .me-txt, body.sb-collapsed .me-chev{ display:none; }
    .me-pop{ position:absolute; left:12px; right:12px; bottom:56px; background:#fff; border-radius:8px; box-shadow:0 0 1px #2226314D,0 8px 24px #00000026; padding:6px; display:none; z-index:400; min-width:208px; }
    .me-pop.open{ display:block; }
    body.sb-collapsed .me-pop{ left:60px; right:auto; bottom:0; }
    .me-pop-lbl{ font-size:13px; color:#6d7381; padding:8px 12px 4px; }
    .me-pop button{ width:100%; justify-content:flex-start; gap:10px; padding:10px 12px; border:none; background:none; border-radius:6px; font-size:15px; color:#222631; cursor:pointer; }
    .me-pop button:hover{ background:#f6f7f9; }
    .me-pop button svg{ width:16px; height:16px; }
    .me-pop .chk{ margin-left:auto; color:#416bff; }
    .me-pop-div{ height:1px; background:#f1f3f5; margin:4px 6px; }

    
    .main{ padding-left:248px; min-height:100vh; display:flex; flex-direction:column; transition:padding-left .2s; }
    body.sb-collapsed .main{ padding-left:68px; }
    .page{ max-width:1320px; width:100%; margin:0 auto; padding:36px 40px 0; flex:1; display:flex; flex-direction:column; }
    .cols{ display:flex; gap:28px; align-items:flex-start; }
    .col-main{ flex:1; min-width:0; }
    .col-rail{ width:300px; flex-shrink:0; display:flex; flex-direction:column; gap:20px; }

    
    .todo{ margin:0 0 36px; }
    .h2-row{ display:flex; align-items:center; justify-content:space-between; gap:14px; padding:0 0 14px; }
    .h2{ font-size:22px; font-weight:700; margin:0; display:flex; align-items:center; gap:8px; }
    .h2 .cnt{ font-size:16px; font-weight:600; color:#416bff; }
    .more{ background:none; border:none; padding:0; font-size:14px; color:#6d7381; cursor:pointer; gap:2px; }
    .more:hover{ color:#222631; }
    .todo-box{ background:#fff; border:1px solid #e6e8ec; border-radius:12px; padding:4px 20px; }
    .todo-grid{ display:grid; grid-template-columns:1fr; }   
    .ti{ display:flex; align-items:center; gap:8px; padding:12px 0; min-width:0; border-top:1px solid #f1f3f5; }
    .ti:first-child{ border-top:none; }
    .ti .dt{ width:7px; height:7px; border-radius:50%; background:#b8bdc7; flex-shrink:0; }
    .ti .x{ flex:1; min-width:0; }
    .ti .x b{ display:block; font-size:16px; font-weight:600; color:#222631; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .ti .x small{ display:block; font-size:14px; color:#6d7381; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .ti .go{ background:none; border:none; padding:0; font-size:14px; font-weight:600; color:#3151c4; cursor:pointer; gap:1px; white-space:nowrap; flex-shrink:0; }
    .ti .go:hover{ text-decoration:underline; }

    
    .tools{ display:flex; align-items:center; gap:14px; }
    .tgl{ display:inline-flex; align-items:center; gap:8px; cursor:pointer; user-select:none; font-size:15px; color:#3b3f4c; }
    .tgl-track{ width:40px; height:22px; border-radius:100px; background:#d9d9d9; position:relative; transition:background .15s; flex-shrink:0; }
    .tgl-knob{ position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition:left .15s; box-shadow:0 1px 3px rgba(0,0,0,.2); }
    .tgl.on .tgl-track{ background:#416bff; } .tgl.on .tgl-knob{ left:20px; }
    .sel{ height:38px; padding:0 36px 0 12px; border:1px solid #d9d9d9; border-radius:6px; font-size:14px; color:#3b3f4c; cursor:pointer; appearance:none; -webkit-appearance:none; background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='%236d7381' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>") no-repeat right 12px center; font-family:inherit; }
    .btn-primary{ height:40px; border-radius:100px; padding:0 18px; background:#416bff; color:#fff; border:none; font-size:15px; font-weight:600; cursor:pointer; gap:6px; }
    .btn-primary:hover{ background:#365eef; }

    
    .sem{ margin-bottom:8px; }
    .sem-hd{ display:flex; align-items:center; gap:12px; padding:14px 0; cursor:pointer; user-select:none; }
    .sem-title{ font-size:20px; font-weight:700; }
    .sem-meta{ font-size:14px; color:#6d7381; }
    .sem-chev{ margin-left:auto; color:#6d7381; transition:transform .15s; }
    .sem.closed .sem-chev{ transform:rotate(180deg); }
    .sem.closed .sem-body{ display:none; }
    .sem-body{ padding-bottom:18px; }
    .grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }

    
    .cc{ background:#fff; border-radius:12px; padding:22px; cursor:pointer; box-shadow:0 0 1px #2226314D,0 2px 8px #0000000F; position:relative; transition:box-shadow .12s; }
    .cc:hover{ box-shadow:0 0 0 1.5px #ccdfff,0 4px 12px #0000001A; }
    .cc.arch{ background:#fbfbfc; }
    .cc-top{ display:flex; align-items:center; gap:12px; }
    .cc-ico{ width:40px; height:40px; border-radius:10px; background:#e9f2ff; color:#3151c4; font-size:15px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
    .cc.arch .cc-ico{ background:#f1f3f5; color:#9ea3ad; }
    .cc-head{ flex:1; min-width:0; }
    .cc-name{ font-size:17px; font-weight:600; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .cc.arch .cc-name{ color:#6d7381; }
    .cc-meta{ font-size:14px; color:#6d7381; margin:2px 0 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .cc-menu{ width:30px; height:30px; border:none; background:none; border-radius:6px; cursor:pointer; color:#6d7381; flex-shrink:0; }
    .cc-menu:hover{ background:#f1f3f5; }
    .ev{ margin-top:26px; }
    .ev-bar{ display:flex; gap:3px; height:6px; }
    .ev-bar i{ flex:1; border-radius:3px; background:#e4e7ec; position:relative; }
    .ev-bar i.done{ background:#416bff; } .ev-bar i.prog{ background:#a3c3ff; }
    .cc.arch .ev-bar i.done{ background:#c7cbd3; }
    .ev-names{ display:flex; gap:3px; margin-top:8px; }
    .ev-names span{ flex:1; min-width:0; font-size:13px; color:#6d7381; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .ev-names span.done{ color:#3151c4; }
    .ev-txt{ font-size:14px; color:#6d7381; margin:12px 0 0; padding-top:12px; border-top:1px solid #f1f3f5; display:flex; align-items:center; gap:6px; }
    .ev-txt b{ font-weight:600; color:#3b3f4c; }

    
    .rail{ background:#fff; border-radius:12px; padding:20px; box-shadow:0 0 1px #2226314D,0 2px 8px #0000000F; }
    .rail-hd{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
    .rail-title{ font-size:17px; font-weight:700; }
    .nt{ display:flex; align-items:center; gap:8px; padding:8px 0; font-size:14px; color:#3b3f4c; cursor:pointer; }
    .nt:hover{ color:#222631; }
    .nt-txt{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .nt-date{ font-size:14px; color:#9ea3ad; flex-shrink:0; }
    .new{ display:inline-flex; align-items:center; height:18px; padding:0 5px; border-radius:4px; background:#e9f2ff; color:#3151c4; font-size:11px; font-weight:600; line-height:1; flex-shrink:0; }
    .res{ display:flex; align-items:flex-start; gap:12px; border-radius:8px; padding:14px 16px; background:#f4f8ff; cursor:pointer; }
    .res + .res{ margin-top:8px; }
    .res:hover{ background:#e9f2ff; }
    .res svg{ width:20px; height:20px; color:#2081ff; flex-shrink:0; margin-top:1px; }
    .res.gray{ background:#f6f7f9; } .res.gray:hover{ background:#eef0f3; } .res.gray svg{ color:#6d7381; }
    .res-name{ font-size:16px; font-weight:600; color:#18181b; margin:0 0 4px; }
    .res-desc{ font-size:14px; color:#3b3f4c; margin:0; line-height:1.5; }

    
    .view{ display:none; } .view.on{ display:flex; }
    #v-roster.on{ display:block; }
    .crumb{ display:flex; align-items:center; gap:4px; font-size:14px; color:#6d7381; margin-bottom:12px; }
    .crumb a:hover{ color:#222631; text-decoration:underline; }
    .crumb span{ color:#222631; font-weight:500; }
    .page-h1{ font-size:26px; font-weight:700; margin:0 0 6px; display:flex; align-items:center; gap:8px; }
    .page-h1 .cnt{ font-size:18px; color:#416bff; }
    .page-sub{ font-size:16px; color:#3b3f4c; margin:0 0 24px; }
    .add-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; margin-bottom:32px; }
    .add-card{ background:#fff; border-radius:12px; padding:22px; box-shadow:0 0 1px #2226314D,0 2px 8px #0000000F; display:flex; flex-direction:column; }
    .add-t{ display:flex; align-items:center; gap:8px; font-size:17px; font-weight:700; margin:0 0 4px; }
    .add-t svg{ width:20px; height:20px; color:#416bff; }
    .add-d{ font-size:14px; color:#6d7381; margin:0 0 16px; line-height:1.5; }
    .code-row{ display:flex; align-items:center; gap:10px; }
    .code{ height:44px; padding:0 18px; border-radius:8px; background:#f4f8ff; border:1px dashed #a3c3ff; color:#3151c4; font-size:20px; font-weight:700; letter-spacing:.18em; display:inline-flex; align-items:center; }
    .inp{ height:44px; border:1px solid #d9d9d9; border-radius:8px; padding:0 14px; font-size:16px; color:#222631; font-family:inherit; outline:none; background:#fff; width:220px; }
    .inp:focus{ border-color:#416bff; box-shadow:0 0 0 3px #e9f2ff; }
    .btn-sec{ height:44px; padding:0 16px; border-radius:8px; border:1px solid #d9d9d9; background:#fff; color:#3b3f4c; font-size:15px; font-weight:500; cursor:pointer; gap:6px; }
    .btn-sec:hover{ background:#f6f7f9; }
    .btn-solid{ height:44px; padding:0 20px; border-radius:8px; border:none; background:#416bff; color:#fff; font-size:15px; font-weight:600; cursor:pointer; gap:6px; }
    .btn-solid:hover{ background:#365eef; }
    .btn-solid:disabled{ background:#c7cbd3; cursor:not-allowed; }
    .btn-solid.sm{ height:36px; padding:0 14px; font-size:14px; }
    .txt-link{ align-self:flex-start; margin-top:auto; padding-top:16px; background:none; border:none; font-size:14px; color:#6d7381; text-decoration:underline; cursor:pointer; }
    .txt-link:hover{ color:#222631; }
    .sid-res{ margin-top:12px; display:flex; align-items:center; gap:12px; padding:10px 14px; border-radius:8px; background:#f6f7f9; font-size:15px; }
    .sid-res b{ font-weight:600; }
    .sid-res .dim{ color:#6d7381; font-size:14px; }
    .sid-res .r{ margin-left:auto; font-size:14px; color:#6d7381; }
    .sid-res.none{ background:none; padding:10px 0 0; color:#f2525f; font-size:14px; }
    .tbl-hd{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
    .tbl-t{ font-size:20px; font-weight:700; }
    .tbl-filter{ display:flex; align-items:center; gap:8px; height:38px; padding:0 12px; border:1px solid #d9d9d9; border-radius:6px; background:#fff; color:#6d7381; }
    .tbl-filter input{ border:none; outline:none; font-size:14px; font-family:inherit; width:200px; color:#222631; }
    .tbl-wrap{ background:#fff; border-radius:12px; box-shadow:0 0 1px #2226314D,0 2px 8px #0000000F; overflow:hidden; }
    .tbl{ width:100%; border-collapse:collapse; }
    .tbl th{ background:#f6f7f9; font-size:14px; font-weight:600; color:#6d7381; padding:12px 16px; text-align:center; border-bottom:1px solid #eceef1; }
    .tbl td{ font-size:15px; padding:13px 16px; text-align:center; border-bottom:1px solid #f1f3f5; }
    .tbl tr:last-child td{ border-bottom:none; }
    .tbl tr.fresh td{ background:#f4f8ff; }
    .tbl .muted{ color:#9ea3ad; }
    .tag{ display:inline-flex; align-items:center; height:24px; padding:0 8px; border-radius:6px; font-size:13px; font-weight:500; background:#f1f3f5; color:#3b3f4c; }
    .row-x{ background:none; border:none; font-size:14px; color:#6d7381; cursor:pointer; text-decoration:underline; }
    .ev-txt .r{ margin-left:auto; background:none; border:none; padding:0; font-size:14px; font-weight:600; color:#3151c4; cursor:pointer; gap:1px; }
    .ev-txt .r:hover{ text-decoration:underline; }

    
    .toast{ position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(12px); opacity:0; min-width:320px; max-width:560px; padding:14px 22px 14px 16px; border-radius:4px; display:flex; align-items:center; gap:12px; font-size:15px; font-weight:600; box-shadow:0 0 1px #2226314D,0 4px 12px #00000026; z-index:9999; transition:opacity .2s,transform .2s; pointer-events:none; background:#416bff; color:#fff; }
    .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
    .footer{ margin-top:auto; padding:48px 0 40px; display:flex; flex-direction:column; align-items:center; gap:14px; }
    .footer-links{ display:flex; align-items:center; }
    .footer-links a{ font-size:14px; color:#3b3f4c; padding:0 16px; }
    .footer-links a + a{ border-left:1px solid #dde1e8; }
    .footer-copy{ font-size:14px; color:#9aa0ad; }
  </style>

<aside class="sb">

  ROSTER_BASE.push(['202312345','김서연','Seoyeon Kim','국어교육과','Korean Ed.','code',1]);   
  for (let k=0;k<33;k++){ const a=(k*7)%24, b=(k*5+3)%18, x=k%6; ROSTER_BASE.push([String(202310100+k*37), ln[a]+fn[b], fe[b]+' '+le[a], dk[x], de[x], how[k%5], k%9===4?0:1]); } })();
const rosters = {};
const rosterOf = id => (rosters[id] = rosters[id] || ROSTER_BASE.slice(0, (cById(id)||{n:ROSTER_BASE.length}).n).map(r=>({sid:r[0], ko:r[1], en:r[2], dko:r[3], den:r[4], how:r[5], login:r[6]})));

const STUDENT_DB = [
  {sid:'202312345', ko:'김서연', en:'Seoyeon Kim', dko:'국어교육과', den:'Korean Ed.'},
  {sid:'202211876', ko:'정민호', en:'Minho Jung', dko:'일반사회교육과', den:'Social Studies Ed.'},
  {sid:'202415520', ko:'한유진', en:'Yujin Han', dko:'교육학과', den:'Education'},
  ...ROSTER_BASE.map(r=>({sid:r[0], ko:r[1], en:r[2], dko:r[3], den:r[4]})),
];
let view = 'home', rosterId = 'c1', freshSid = null, showN = 10;   

function go(v, id){
  view = v; if (id) rosterId = id;
  freshSid = null; document.getElementById('sidInp').value = ''; document.getElementById('sidRes').innerHTML = ''; document.getElementById('sidGo').disabled = true;
  location.hash = v==='roster' ? 'roster-'+rosterId : '';
  render(); window.scrollTo(0,0);
}
function renderRoster(){
  const c = cById(rosterId), list = rosterOf(rosterId);
  document.getElementById('rCode').textContent = CODES[rosterId];
  const f = document.getElementById('rFilter');
  f.placeholder = t('filterPh');
  const q = f.value.trim().toLowerCase();
  const rows = list.filter(r=>!q || r.sid.includes(q) || r.ko.includes(q) || r.en.toLowerCase().includes(q));
  const how = {code:t('howCode'), prof:t('howProf'), excel:t('howExcel')};
  const vis = q ? rows : rows.slice(0, showN);
  document.getElementById('rBody').innerHTML = !list.length ? `<tr><td colspan="6" style="padding:32px;color:#6d7381">${t('rosterEmpty')}</td></tr>` : vis.map(r=>`<tr class="${r.sid===freshSid?'fresh':''}"><td>${r.sid}</td><td>${lang==='ko'?r.ko:r.en}</td><td>${lang==='ko'?r.dko:r.den}</td><td><span class="tag">${how[r.how]}</span></td><td class="${r.login?'':'muted'}">${r.login?t('loginDone'):t('loginYet')}</td><td><button class="row-x" onclick="removeSid('${r.sid}')">${t('remove')}</button></td></tr>`).join('')
    + (!q && rows.length > showN ? `<tr><td colspan="6"><button class="row-x" onclick="showN+=10; renderRoster()">${t('moreRows')(Math.min(10, rows.length-showN))}</button></td></tr>` : '');
}
function sidChange(){
  const v = document.getElementById('sidInp').value.replace(/\D/g,'');
  document.getElementById('sidInp').value = v;
  document.getElementById('sidGo').disabled = v.length < 9;
  document.getElementById('sidRes').innerHTML = '';
}
function findSid(){
  const v = document.getElementById('sidInp').value.trim(), box = document.getElementById('sidRes');
  const st = STUDENT_DB.find(s=>s.sid===v);
  if (!st){ box.innerHTML = `<div class="sid-res none">${t('sidNone')}</div>`; return; }
  const inList = rosterOf(rosterId).some(r=>r.sid===v);
  const nm = lang==='ko'?st.ko:st.en, dp = lang==='ko'?st.dko:st.den;
  box.innerHTML = `<div class="sid-res"><b>${nm}</b><span class="dim">${st.sid} · ${dp}</span>${inList ? `<span class="r">${t('sidIn')}</span>` : `<button class="btn-solid sm" style="margin-left:auto" onclick="addSid('${st.sid}')">${t('add')}</button>`}</div>`;
}
function addSid(sid){
  const st = STUDENT_DB.find(s=>s.sid===sid);
  rosterOf(rosterId).unshift({...st, how:'prof', login:0});
  freshSid = sid;
  document.getElementById('sidInp').value = ''; document.getElementById('sidRes').innerHTML = ''; document.getElementById('sidGo').disabled = true;
  renderRoster(); toast(t('added')(lang==='ko'?st.ko:st.en));
}
function removeSid(sid){
  const l = rosterOf(rosterId), i = l.findIndex(r=>r.sid===sid), r = l[i];
  if (!confirm(t('removeAsk')(lang==='ko'?r.ko:r.en))) return;   
  l.splice(i,1); renderRoster(); toast(t('removed')(lang==='ko'?r.ko:r.en));
}
function copyCode(){ try{ navigator.clipboard.writeText(CODES[rosterId]); }catch(e){} toast(t('copied')); }

let todoOpen = false;
const L = o => lang==='ko' ? o.ko : o.en;
const cById = id => COURSES.find(c=>c.id===id);
const cName = c => lang==='ko' ? c.ko : c.en;
const ini = c => lang==='ko' ? c.ko[0] : c.en[0];

function render(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el=>{ const v = t(el.dataset.t); if (typeof v === 'string') el.textContent = v; });
  document.getElementById('v-home').classList.toggle('on', view==='home');
  document.getElementById('v-roster').classList.toggle('on', view==='roster');
  NAV[0].active = view==='home';
  if (view==='roster') renderRoster();

  
  const navItem = (n)=>`<div class="si${n.active?' active':''}" onclick="${n.k==='home'?"go('home')":'notReady()'}"><i data-lucide="${n.ic}"></i><span class="si-label">${T[lang].nav[n.k]}</span><span class="si-tip">${T[lang].nav[n.k]}</span></div>`;
  document.getElementById('nav').innerHTML = NAV.map(navItem).join('');
  document.getElementById('navBottom').innerHTML = NAV_BOTTOM.map(navItem).join('');
  document.getElementById('sbCourses').innerHTML = COURSES.filter(c=>c.sem==='s2' && !c.arch).map(c=>
    `<div class="sc${view==='roster'&&rosterId===c.id?' on':''}" onclick="go('roster','${c.id}')" title="${cName(c)}"><span class="sc-ini">${ini(c)}</span><span class="sc-name">${cName(c)}</span><span class="si-tip">${cName(c)}</span></div>`).join('');

  
  const list = todoOpen ? TODO : TODO.slice(0,4);
  document.getElementById('todoCnt').textContent = TODO.length;
  document.getElementById('todoGrid').innerHTML = list.map(x=>{
    const c = cById(x.c); let [ev, st, fact] = L(x), goL = lang==='ko'?x.goKo:x.goEn;
    
    const fe = typeof evById==='function' ? evById(x.c, x.e) : null, fl = fe && typeof flowActLabel==='function' ? flowActLabel(fe) : null;
    if (fl){ st = lang==='ko' ? '현장 채점' : 'Field grading'; fact = lang==='ko' ? `${fe.sub}명` : `${fe.sub} students`; goL = fl; }
    const sec = lang==='ko' ? c.secKo : c.secEn;
    return `<div class="ti"><span class="dt"></span><div class="x"><b>${cName(c)} · ${sec}</b><small>${ev} · ${st} · ${fact}</small></div><button class="go" onclick="go('eval','${x.c}',${x.e})">${goL}<i data-lucide="chevron-right" style="width:16px;height:16px"></i></button></div>`;
  }).join('');
  const more = document.getElementById('todoMore');
  more.style.display = TODO.length>4 ? '' : 'none';
  more.innerHTML = todoOpen ? `${t('fold')}<i data-lucide="chevron-up" style="width:16px;height:16px"></i>` : `${t('more')(TODO.length-4)}<i data-lucide="chevron-right" style="width:16px;height:16px"></i>`;

  
  const sv = 'recent';

  
  const showArch = document.getElementById('archTgl').classList.contains('on');
  const semHtml = ['s2','s1'].map((s,i)=>{
    let cs = COURSES.filter(c=>c.sem===s && (showArch || !c.arch));
    if (sv==='name') cs = [...cs].sort((a,b)=>cName(a).localeCompare(cName(b), lang));
    const open = (window._semOpen||{s2:true})[s];
    return `<section class="sem${open?'':' closed'}" data-s="${s}">
      <div class="sem-hd" onclick="toggleSem('${s}')"><span class="sem-title">${T[lang].sems[s]}</span><span class="sem-meta">${t('semCnt')(cs.length)}</span><i data-lucide="chevron-up" class="sem-chev"></i></div>
      <div class="sem-body"><div class="grid">${cs.map(card).join('')}</div></div>
    </section>`;
  }).join('');
  document.getElementById('sems').innerHTML = semHtml;

  
  document.getElementById('notices').innerHTML = NOTICES.map(n=>`<div class="nt" onclick="notReady()">${n.isNew?'<span class="new">NEW</span>':''}<span class="nt-txt">${L(n)}</span><span class="nt-date">${n.d}</span></div>`).join('');

  document.getElementById('chk-ko').style.visibility = lang==='ko'?'visible':'hidden';
  document.getElementById('chk-en').style.visibility = lang==='en'?'visible':'hidden';
  document.getElementById('sbFold').title = lang==='ko' ? '메뉴 접기' : 'Collapse menu';
  lucide.createIcons();
}


function cardTodo(c){
  if (typeof evOf !== 'function') return `<span>${t('evCount')(c.ev.length)}</span>`;
  
  const flow = e => typeof flowActLabel==='function' ? flowActLabel(e) : null;
  const evs = evOf(c.id), k = {rev:0, rel:0, ai:0}; evs.forEach(e=>{ if (flow(e)) return; const a = nextAct(e); if (k[a]!==undefined) k[a]++; });
  const parts = [...evs.filter(flow).map(e=>`${evName(e)} · ${flow(e)}`), k.rev && t('ccRev')(k.rev), k.rel && t('ccRel')(k.rel), k.ai && t('ccAi')(k.ai)].filter(Boolean);
  return `<span class="cc-todo-t">${parts.length ? parts.map(p=>`<b>${p}</b>`).join('<span class="sep">·</span>') : `<span class="muted">${t('evCount')(evs.length)} · ${t('ccNone')}</span>`}</span>`;   
}
function card(c){
  const done = c.ev.filter(e=>e[2]==='done').length, sec = lang==='ko'?c.secKo:c.secEn;
  return `<div class="cc${c.arch?' arch':''}" onclick="notReady()" title="${cName(c)}">
    <div class="cc-top"><span class="cc-ico">${ini(c)}</span>
      <div class="cc-head"><p class="cc-name">${cName(c)}</p><p class="cc-meta">${sec} · ${t('students')(c.n)}</p></div>
      <button class="cc-menu" onclick="event.stopPropagation(); notReady()"><i data-lucide="more-vertical" style="width:18px;height:18px"></i></button></div>
    <p class="ev-txt cc-todo">${cardTodo(c)}<button class="r" onclick="event.stopPropagation(); go('roster','${c.id}')">${t('rosterLink')}<i data-lucide="chevron-right" style="width:16px;height:16px"></i></button></p>
  </div>`;
}

function toggleSem(s){ window._semOpen = window._semOpen || {s2:true}; window._semOpen[s] = !window._semOpen[s]; render(); }
function toggleTodo(){ todoOpen = !todoOpen; render(); }
function setLang(l){ lang = l; document.getElementById('mePop').classList.remove('open'); render(); }
function togglePop(e){ e.stopPropagation(); document.getElementById('mePop').classList.toggle('open'); }
document.addEventListener('click', ()=>document.getElementById('mePop').classList.remove('open'));
function toggleSb(){
  document.body.classList.toggle('sb-collapsed');
  const c = document.body.classList.contains('sb-collapsed');
  document.getElementById('sbFold').innerHTML = `<i data-lucide="${c?'panel-left-open':'panel-left-close'}" style="width:20px;height:20px"></i>`;
  lucide.createIcons();
}
let tt;
function toast(msg){ document.getElementById('toastMsg').textContent = msg; const el = document.getElementById('toast'); el.classList.add('show'); clearTimeout(tt); tt = setTimeout(()=>el.classList.remove('show'), 1800); }
function notReady(){ toast(t('notReady')); }

if (location.hash.includes("en")) lang = "en";
{ const m = location.hash.match(/roster-(c\d+)/); if (m){ view = 'roster'; rosterId = m[1]; } }
render();
if (location.hash.includes("collapsed")) toggleSb();
</script>
